name: Release

# A release is a pushed tag vMAJOR.MINOR.PATCH on a commit of main whose
# version (initialize_claude_ai/__init__.py) and CHANGELOG.md section match it.
# See docs/release-process.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: The tag names this version, and the changelog has its notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/check_version.py --tag "$TAG"
          python3 tools/check_version.py --notes > release-notes.md
      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -n auto
      - name: Build
        run: |
          python -m build
          python -m twine check --strict dist/*
          cd dist && sha256sum -- * > SHA256SUMS
      - name: The wheel installs and carries its data
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/check_package_data.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            release-notes.md
          retention-days: 7

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: artifact
      - name: Locate the files
        id: files
        run: |
          notes="$(find artifact -name release-notes.md | head -1)"
          dist="$(dirname "$(find artifact -name SHA256SUMS | head -1)")"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.files.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.files.outputs.dist }}/*.whl
            ${{ steps.files.outputs.dist }}/*.tar.gz
            ${{ steps.files.outputs.dist }}/SHA256SUMS
