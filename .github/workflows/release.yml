name: Release

# A release is a pushed tag vMAJOR.MINOR.PATCH on a commit of main whose
# version (initialize_claude_ai/__init__.py) and CHANGELOG.md section match it.
# See docs/release-process.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag names this version, and the changelog has its notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/check_version.py --tag "$TAG"
          python3 tools/check_version.py --notes > release-notes.md
      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -n auto
      - name: Build
        run: |
          python -m build
          python -m twine check --strict dist/*
          cd dist && sha256sum -- * > SHA256SUMS
      - name: The wheel installs and carries its data
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/check_package_data.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            release-notes.md
          retention-days: 7

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: artifact
      - name: Locate the files
        id: files
        run: |
          notes="$(find artifact -name release-notes.md | head -1)"
          dist="$(dirname "$(find artifact -name SHA256SUMS | head -1)")"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.files.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.files.outputs.dist }}/*.whl
            ${{ steps.files.outputs.dist }}/*.tar.gz
            ${{ steps.files.outputs.dist }}/SHA256SUMS
