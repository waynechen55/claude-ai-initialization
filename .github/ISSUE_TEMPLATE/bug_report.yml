name: Bug report
description: Something the program did wrong, or reported wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste credentials, tokens or internal host names**:
        replace them with placeholders (`example.com`, `<TOKEN>`). Security problems go to
        a [private advisory](https://github.com/waynechen55/claude-ai-initialization/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `initialize-claude-ai --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Distribution and version, Python version (`python3 --version`).
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command line (flags included, values redacted).
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `claude_ai_initialization.log`, redacted. A few lines around the failure are enough.
      render: text
