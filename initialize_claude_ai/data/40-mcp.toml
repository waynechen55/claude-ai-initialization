or cloned under another name. Declare the variable your server reads its login from (in secret_env) even \
when it answers without one -- read the server's own code for it (API_ACCESS_TOKEN, BUGZILLA_API_KEY); an \
anonymous answer is not a login, and a server that answers with "currentUser": null sent none. Never point \
an entry at a generic name another program may export (BUGZILLA_API_KEY, SSL_CERT_FILE): the caller writes \
every reference under a name only that entry reads. A 429 or 5xx is "try later", never an answer about \
what the address is or how it logs in. Propose a registry package by its launcher form (uvx <pkg>==<version>, \
npx -y <pkg>@<version>), never an installer's private path (a `uv tool` or pipx environment, a global npm \
bin): that script runs only beside its own install, and .mcp.json is copied to other machines.
"""
# Added to a tier-1 (endpoint) agent's brief: how to report an endpoint that
# refuses without a credential.  {variable} is the name the entry will read,
# {shape} what its value looks like and {obtain} where one comes from -- all
# three as the writer would choose them, auth profiles included.  Empty
# removes the paragraph.
auth_wall_brief = """
If an endpoint refuses you for want of a credential (401/403, or a body such as \
"no api key"), do not drop it: propose it as a candidate with `"requires_auth": true`, \
an `"auth_evidence"` sentence saying what showed it (the refusal, the product's \
documentation), and `"secret_env": {"{variable}": "env:{variable}"}`. Its value is \
{shape}; one comes from {obtain}. Never put a credential value anywhere in your reply. \
It will be probed independently and, if it holds up, registered with an empty slot \
for the operator to fill. When the operator has exported a real credential, the caller \
also calls one read-only tool with it (mcp.verification.login_check) and reports it as \
accepted, rejected, or without API access; a listing is never proof that a credential \
works. A rejected credential needs a new token, not a new package -- propose another \
server only when the account cannot use this API at all (no API access), and say which.
"""
# What the agent is told when an entry does not start (mcp.healing). The server
# name, the entry as written, the failure and what discovery knew about it are
# appended below this.
repair_brief = """
This .mcp.json entry does not start. Work out why and return a corrected candidate.

It is launched the way Claude Code launches it: with the entry's own `env` and a narrow \
passthrough (PATH, HOME) and NOTHING ELSE, from the client's own directory, with a \
stand-in in any credential slot the trial filled. A variable that happens to be \
exported in a shell is not passed on and a relative path does not resolve, so anything \
the server reads must be named in the entry. The failure below is followed by how the \
launch that was proven differs from the entry, by variable name.

Things worth changing, in rough order of likelihood:
  - a variable the server needs that the entry does not declare
  - an argument spelled the way another version of the package wanted
  - a binary or interpreter that is not where the entry says, or is a bare name
  - a script or data file this run generated that is wrong, missing, or does not
    match the script that reads it -- you may rewrite files you created
  - a base URL, path or transport the server rejects
  - the server reads the operator's own configuration (a dotfile under HOME or \
    XDG_CONFIG_HOME, such as an oscrc or netrc) before its entry's, and that \
    configuration points somewhere else: give the entry a configuration scope of its \
    own (the caller tries this as isolate_user_config) -- never edit or copy the \
    operator's file
  - it fails exactly the same with and without the credential: then the credential is \
    not what it is missing, whatever its message says
  - its listings answered with nothing ("unproved: the listings came back empty"): \
    an empty answer is not access -- check with a call that returns the account's own \
    data, or move to the API the account can see into
  - a call answered that a setting is written in a form the server rejects \
    ("misconfigured"): an address with or without a scheme, a trailing slash, the API \
    host instead of the web host -- take the form from the server's own default or \
    documentation
  - a value does not fit its slot: a bare token where a header list (Name:value pairs) \
    is read -- the verdict gives the exact form; never copy a value from an existing \
    entry or file to fix it
  - it names this program's own variables (ICA_MCP_*) without a default, or files that \
    are not on this machine -- an entry copied from elsewhere; regenerate it

You may run the command yourself to see the failure. Do not weaken TLS, do not put a \
credential in the entry, and do not claim it works -- whatever you return is launched \
again and kept only if it starts.

If you cannot fix it, say so and return no candidates: something else will be tried, \
and a wrong answer costs more than no answer."""

# What each class of agent failure says, as regular expressions matched
# case-insensitively -- the class decides the next attempt.  Tested in this
# order, and the first that matches wins:
#   unusable   the installation cannot serve any request (model not enabled,
#              credential rejected, quota gone): stop asking, say so once.
#              unusable_markers and the credential-failure markers add plain
#              wordings to it.
#   refusal    the request was declined: reword it or change model.  Narrow on
#              purpose -- "connection refused" is the network, and transient.
#   timeout    the clock ran out mid-work: a smaller brief, not a repeat.
#   transient  this moment failed, not this request: the same again may pass.
# Anything else is "other".  A class left out keeps the built-in wordings.
[mcp.agent.failure_patterns]
# The runtime's own Claude Code is too old for the configured model ("Claude
# Code 2.1.259 does not support this model"): the other runtime is tried with
# the same model, else this runtime's default model -- and the report says to
# update it or set mcp.agent.model.
unsupported_model = [
    'does not support (?:this|the) model',
    'model .{0,60}(?:is not supported|unsupported)',
    'unrecognized_model',
]
unusable = [
    'not available on your',
    'is not available\b.*\bdeployment',
    'model .{0,60}(?:not found|does not exist|is not enabled)',
    '\b404\b.*model',
    'model.*\b404\b',
    'invalid[_ ]api[_ ]key',
    'authentication[_ ]error',
    'not authenticated',
    '\b40[13]\b.*(?:credential|api key|permission)',
    'quota (?:exceeded|exhausted)',
    'billing',
]
refusal = [
    'safeguards',
    'flagged this (?:message|request)',
    'legal/aup',
    "can(?:no|')t respond to this",
    'refused this (?:message|request)',
    'request was refused',
    'declined to (?:respond|answer|help)',
]
timeout = [
    'exceeded mcp\.agent\.timeout_seconds',
    'timed out',
    'timeout',
    'deadline exceeded',
]
transient = [
    'overloaded',
    'rate.?limit',
    'too many requests',
    'temporar',
    'unavailable',
    'connection (?:reset|refused|error)',
    '\b50[234]\b',
]

# Credential-failure profiles for the model behind the agents.  One table per
# credential; the name is only a label.  smelt.example.net lost its agents part-way
# through a run because the Google Cloud credential behind Vertex expired: every
# call said "Could not load Google Cloud credentials", which no pattern knew, so
# each stage retried it three times and the advice was to raise max_attempts.
#
#   markers          wordings (case-insensitive substrings) that mean this
#                    credential is the problem.  Each also counts as an
#                    unusable_markers entry.
#   refresh          one NON-interactive command that renews it: an argv with
#                    {tool} tokens resolved as binaries, or the dotted settings
#                    key of an argv defined elsewhere.  Empty = nothing to try.
#   remedy           what the operator runs when the refresh is not enough.
#   timeout_seconds  optional; defaults to credential_refresh_timeout_seconds.
#
# Add a table for any other provider; nothing in code names one.
[mcp.agent.credential_failures.google_cloud]
markers = [
    "could not load google cloud credentials",
    "could not load the default credentials",
    "reauthentication is needed",
    "invalid_grant",
    "token has been expired or revoked",
]
# Asking for an application-default token renews it from the refresh token
# when that is still good; the command is the one phase 2 already uses.
refresh = "auth.google_cloud.commands.print_adc_token"
remedy = "gcloud auth application-default login --no-launch-browser"

[mcp.agent.credential_failures.aws]
markers = [
    "unable to locate credentials",
    "the security token included in the request is expired",
    "expiredtokenexception",
    "the sso session associated with this profile has expired",
]
# `aws sso login` needs a browser, so there is nothing to try unattended.
refresh = []
remedy = "aws sso login"

# Which subagent drives which stage.  Unmapped stages fall back to matching the
# stage name against the definition names below.
[mcp.agent.stage_agents]
endpoint = "mcp-endpoint-scout"
package = "mcp-package-scout"
bridge = "mcp-bridge-engineer"
strategy = "mcp-strategist"

# Subagent definitions, one per stage.  These become AgentDefinition entries for
# the SDK and --agents JSON for the CLI.  The long-form instructions live in the
# skills under skills/ ; `objective` is the one-line brief the stage prompt is
# built around, so the wording can be tuned without touching Python.
[mcp.agent.definitions.mcp-endpoint-scout]
description = "Finds a live native MCP endpoint on a target server by checking the documented paths."
objective = """This is tier 1, and nothing below it may run until you have finished. Find the URL on \
this target that speaks the Model Context Protocol, or establish -- with documented evidence from all \
four checklist steps -- that there is none. The target is a service this operator already uses and is \
authorised to reach, and every request you make is an ordinary read-only client request of the kind \
any MCP client sends when it connects -- you are configuring a client for it, not testing it. Steps A-D \
are mandatory and each one must come back with what you actually tried: the paths the target's own \
documentation and URL layout point to (not just /mcp), both http and https -- a certificate this host \
does not trust is verified against the trust bundle your brief names, or its issuer reported, never \
switched off (the caller already retried once without verification) -- the specification's own Accept \
headers with the responses read for SSE/WebSocket/JSON-RPC hints, and the target's own documentation \
plus a web search. An endpoint that refuses you for want of a credential is still a finding: propose it with \
requires_auth, auth_evidence and a secret_env reference, never a value. A WebSocket counts only with \
a sign it carries MCP. Any other machine-readable API you meet -- GraphQL, OpenAPI -- is not an \
endpoint, but record it in findings.api_kinds as {kind: {"label", "url"}}: the tiers below bridge it. \
Record one only from a 2xx answer in the API's own form (JSON naming what that API names) -- never \
because an answer contains the path you asked for: error pages repeat it -- and the run asks the URL \
again, with a path beside it that cannot exist, before anything is built for it. \
An endpoint on somebody else's host is this target's only if the target's own organisation publishes it \
or the server names the target: a word that merely contains the product's name ("examplep" is not "example"), \
a registry namespace io.github.<account> (that account published it, not GitHub) or a URL path is no \
tie, and one endpoint that would fit several unrelated targets fits none of them. Once it answers, read \
what the server says it is -- its name, instructions and tools: one that describes a marketplace or \
catalog of other people's tools, or a subject that is not the target, is not the target's server, \
whoever pointed you at it. A claim (a search hit, a listing, a page) never outweighs what the server \
says about itself."""
skill = "mcp-endpoint-discovery"
tools = ["Bash", "Read", "Write", "WebFetch", "WebSearch", "Glob", "Grep"]
# Ask about several paths in one command rather than a turn each.
max_turns = 10

[mcp.agent.definitions.mcp-package-scout]
description = "Finds an existing MCP server package, image or repository for a target."
objective = """Tier 2, and you only run because tier 1 found nothing -- if you discover a native \
endpoint the endpoint stage missed, report it as a url candidate and stop, because it beats any package. \
Otherwise find an MCP server someone has already published for this target -- in the official MCP \
registry, on npm, on PyPI or on GitHub -- and work out the exact command that launches it and every \
environment variable it needs. Search by the kind of API the target serves (GraphQL, OpenAPI) as well as \
by its name: a generic server for that kind, pointed at the target, is a real answer. A registration \
this machine already has for the address was tried before you started; improve on it, never copy it. \
A package is about the target when a whole word, host or registry owner names it -- never a substring \
("examplep_administradores" is not Example) -- and a registry namespace io.github.<account> is the publisher's \
account, not the vendor. A hosted remote on a third party's domain that names neither the target nor its \
organisation is not the target's server, however well it handshakes -- and one whose own answer (name, \
instructions, tools) describes a catalog of other tools or another subject is not it either. Where it is, \
what it is configured for, or what it says it is must name the target; a keyword, a listing or an earlier \
registration of it is only a claim."""
skill = "mcp-package-discovery"
tools = ["Bash", "Read", "Write", "WebFetch", "WebSearch", "Glob", "Grep"]
max_turns = 10

[mcp.agent.definitions.mcp-bridge-engineer]
description = "Writes and tests a bridge program exposing a target's API over MCP."
objective = """Tier 3, the last resort: code that did not exist before this run and that nobody else \
maintains. Prefer an off-the-shelf adapter to new code, and new code only to nothing. Build a bridge \
that exposes whatever interface this target does have over MCP, prove it by handshaking with it, and \
report exactly where you saved it and what has to be installed to run it. A GraphQL API is an API \
description too: a generic server for it is the adapter to try first."""
skill = "mcp-bridge-authoring"
tools = ["Bash", "Read", "Write", "Edit", "WebFetch", "Glob", "Grep"]
max_turns = 12

[mcp.agent.definitions.mcp-strategist]
description = "Proposes and validates remaining ways to obtain MCP access to a target."
objective = """Work out what is left after the earlier stages failed: execute what you safely can, and \
write a concrete, ranked playbook for everything you cannot. Order it by tier -- anything that would \
recover a native endpoint (a credential, a documented path, a VPN) comes before any package, and both \
come before writing code. Never recommend a server that nothing about the target vouches for: its host, \
its configuration or its own answer must name the target, and a catalog or marketplace of other tools \
never counts."""
skill = "mcp-strategy-synthesis"
tools = ["Bash", "Read", "Write", "WebFetch", "WebSearch", "Glob", "Grep"]
max_turns = 10

[mcp.agent.cli]
# Extra flags appended to `claude -p` in CLI runtime mode.
extra_args = []
output_format = "json"

# When a later check withdraws the server that settled an address -- the final
# re-check, a stale verdict judged again, every entry refused at the start
# check, Claude Code itself unable to use what was written -- the address is
# handed over, never given up: another proven server, one waiting for a
# credential (kept until the address is settled), then the stages that were
# skipped only because the withdrawn server had settled the address, worked as
# any stage is, existing registrations first.  gitlab.example.net's re-check withdrew
# mcp-graphql and the bridge that had worked there, one tier down, was never
# looked at.
[mcp.handover]
enabled = true
# How many times one address may be handed over in a run: reopening is owed
# once, never in a loop.
max_rounds = 1
# Reopen the stages skipped because the address was settled by what was withdrawn.
reopen_settled_tiers = true
# Hand over also after publishing, when nothing written works or waits.
after_publish = true
