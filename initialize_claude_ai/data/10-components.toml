  reinstalls_in_place = true
  interpreter = "bash"
  adds_bin_dir = "${HOME}/.bun/bin"

[[components]]
key = "docker"
title = "Container engine CLI (docker)"
group = "mcp-runtimes"
required = false
# A container engine is a system service, not a user tool: it is installed
# only when asked for by name or by --install-prefetch all.
on_demand = false
prefetch = false
  [[components.verify]]
  kind = "binary"
  names = ["docker"]
  version_args = ["--version"]
  min_version = "${cfg:install.toolchains.docker_min_version}"
  env_key = "DOCKER"
  # Installed is not usable: a server launched with `docker run` needs the
  # daemon, and the socket open to this user.  gitlab.example.net's container
  # candidate was rejected as "not accepted" with the daemon stopped.
  [[components.verify]]
  kind = "command"
  purpose = "usable"
  argv = ["docker", "info"]
  timeout_seconds = 30
  remedy = "make the container engine reachable: start its service, and let this user reach its socket"
  remedies."Cannot connect to the Docker daemon" = "start the Docker service: sudo systemctl enable --now docker"
  remedies."Is the docker daemon running" = "start the Docker service: sudo systemctl enable --now docker"
  remedies."permission denied" = "let this user reach the Docker socket: sudo usermod -aG docker $USER, then log in again"
  [[components.install]]
  kind = "system"
  packages.apt = ["docker.io"]
  packages.dnf = ["podman-docker"]
  packages.yum = ["podman-docker"]
  packages.zypper = ["docker"]
  packages.pacman = ["docker"]
  packages.apk = ["docker"]
