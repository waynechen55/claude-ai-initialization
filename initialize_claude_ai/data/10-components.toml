####################################################################
# mcp-runtimes -- toolchains an MCP server may be launched or built with
#
# Not installed by default. They arrive through --install-prefetch (phase 1)
# or --mcp-provision-missing (phase 4, only when a candidate actually needs
# one). Extra fields these entries use:
#   provides         commands that come with the component (bunx with bun)
#   on_demand        false: phase 4 never installs it on its own
#   prefetch         false: --install-prefetch launchers leaves it out
#   bin_dir_queries  ask the tool where it puts what it installs; the first
#                    non-empty answer (plus suffix) joins the search path and
#                    the recorded environment
####################################################################

[[components]]
key = "go"
title = "Go toolchain"
group = "mcp-runtimes"
required = false
provides = ["gofmt"]
bin_dir_queries = [
    { args = ["env", "GOBIN"] },
    { args = ["env", "GOPATH"], suffix = "bin" },
]
  [[components.verify]]
  kind = "binary"
  names = ["go"]
  version_args = ["version"]
  version_regex = 'go([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
  min_version = "${cfg:install.toolchains.go_min_version}"
  env_key = "GO"
  [[components.install]]
  kind = "system"
  packages.apt = ["golang-go"]
  packages.dnf = ["golang"]
  packages.yum = ["golang"]
  packages.zypper = ["go"]
  packages.pacman = ["go"]
  packages.apk = ["go"]
  [[components.install]]
  kind = "brew"
  formulas = ["go"]
  [[components.install]]
  kind = "download"
  # The official tarball; its top directory is go/.
  url = "https://go.dev/dl/go${cfg:install.toolchains.go_version}.{os}-{arch}.tar.gz"
  # go.dev spells architectures its own way; {arch} above uses these.
  arch_names = { x64 = "amd64", arm64 = "arm64", x86 = "386", armv7 = "armv6l" }
  install_dir = "${HOME}/.local/share"
  adds_bin_dir = "${HOME}/.local/share/go/bin"

[[components]]
key = "rust"
title = "Rust toolchain (cargo)"
group = "mcp-runtimes"
required = false
provides = ["rustc", "rustup"]
  [[components.verify]]
  kind = "binary"
  names = ["cargo"]
  version_args = ["--version"]
  min_version = "${cfg:install.toolchains.rust_min_version}"
  env_key = "CARGO"
  [[components.install]]
  kind = "system"
  packages.apt = ["cargo"]
  packages.dnf = ["cargo"]
  packages.yum = ["cargo"]
  packages.zypper = ["cargo"]
  packages.pacman = ["rust"]
  packages.apk = ["cargo"]
  [[components.install]]
  kind = "brew"
  formulas = ["rust"]
  [[components.install]]
  kind = "script"
  # rustup, into the user's home; no root, and the shell profile left alone.
  url = "https://sh.rustup.rs"
  # rustup repairs and updates its own toolchains in place.
  reinstall_argv = ["rustup", "update"]
  interpreter = "sh"
  args = ["-y", "--no-modify-path"]
  adds_bin_dir = "${HOME}/.cargo/bin"

[[components]]
key = "deno"
title = "Deno runtime"
group = "mcp-runtimes"
required = false
  [[components.verify]]
  kind = "binary"
  names = ["deno"]
  version_args = ["--version"]
  min_version = "${cfg:install.toolchains.deno_min_version}"
  env_key = "DENO"
  [[components.install]]
  kind = "system"
  packages.pacman = ["deno"]
  [[components.install]]
  kind = "brew"
  formulas = ["deno"]
  [[components.install]]
  kind = "script"
  url = "https://deno.land/install.sh"
  reinstalls_in_place = true
  interpreter = "sh"
  args = ["-y"]
  adds_bin_dir = "${HOME}/.deno/bin"

[[components]]
key = "bun"
title = "Bun runtime"
group = "mcp-runtimes"
required = false
provides = ["bunx"]
  [[components.verify]]
  kind = "binary"
  names = ["bun"]
  version_args = ["--version"]
  min_version = "${cfg:install.toolchains.bun_min_version}"
  env_key = "BUN"
  [[components.install]]
  kind = "brew"
  formulas = ["oven-sh/bun/bun"]
  [[components.install]]
  kind = "script"
