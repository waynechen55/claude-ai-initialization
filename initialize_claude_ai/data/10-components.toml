####################################################################
# browser -- needed for interactive OAuth; skipped on headless hosts
####################################################################

[[components]]
key = "browser"
title = "Web browser (for OAuth sign-in)"
group = "browser"
required = false
  [[components.verify]]
  kind = "binary"
  # Browsers only. xdg-open used to be in this list and satisfied the check on
  # its own, which meant a machine with a launcher and nothing to launch was
  # reported as having a browser -- and then the sign-in opened nothing and hung
  # waiting for a redirect that could not come. The launcher is a separate
  # component below, and keeping the two apart is the whole point of the split.
  # Kept in step with auth.browser.candidates in 20-auth.toml.
  names = ["firefox", "firefox-esr", "firefox-bin", "chromium", "chromium-browser",
           "google-chrome", "google-chrome-stable", "brave-browser", "vivaldi-stable",
           "microsoft-edge", "microsoft-edge-stable", "epiphany", "falkon", "konqueror"]
  version_args = ["--version"]
  any = true
  optional = true
  [[components.install]]
  kind = "system"
  # One `packages.apt` list serves Debian and Ubuntu alike, and apt fails the
  # whole command when any one name is unknown -- so a list naming both firefox
  # and firefox-esr would install neither. Ubuntu's package is `firefox`; this
  # strategy is tried first, and Debian falls through to the next one.
  packages.apt = ["firefox"]
  packages.dnf = ["firefox"]
  packages.yum = ["firefox"]
  packages.zypper = ["MozillaFirefox"]
  packages.pacman = ["firefox"]
  packages.apk = ["firefox"]
  [[components.install]]
  kind = "system"
  # Debian, where `firefox` is not in the archive at all and the extended
  # support release is what ships. Strategies are tried in order until one
  # succeeds, so this costs an Ubuntu host one failed apt call and nothing else.
  packages.apt = ["firefox-esr"]
  [[components.install]]
  kind = "flatpak"
  refs = ["org.mozilla.firefox"]
  [[components.install]]
  kind = "snap"
  packages = ["firefox"]
  [[components.install]]
  kind = "manual"
  instructions = [
      "No browser was installed. Authentication will use headless device-code flows:",
      "  gcloud auth login --no-launch-browser",
      "  claude setup-token   (paste the URL into a browser on another machine)",
      "Or pass --headless to choose that up front.",
  ]

[[components]]
key = "xdg-utils"
title = "xdg-open (browser launcher)"
group = "browser"
required = false
  [[components.verify]]
  kind = "binary"
  names = ["xdg-open"]
  version_args = ["--version"]
  optional = true
  [[components.install]]
  kind = "system"
  packages.apt = ["xdg-utils"]
  packages.dnf = ["xdg-utils"]
  packages.yum = ["xdg-utils"]
  packages.zypper = ["xdg-utils"]
  packages.pacman = ["xdg-utils"]
  packages.apk = ["xdg-utils"]

[[components]]
key = "clipboard"
title = "Clipboard tool (for the sign-in URL)"
group = "browser"
required = false
# A pasted-code sign-in prints a URL of several hundred characters that has to
# get to a browser somehow. With one of these installed it goes to the clipboard
# by itself and nobody has to select it off a wrapped screen -- and the claude
# CLI's own "press c to copy" starts working too, since that shells out to
# exactly these. Kept in step with [auth.signin.clipboard] in 20-auth.toml.
  [[components.verify]]
  kind = "binary"
  names = ["wl-copy", "xclip", "xsel", "pbcopy", "clip.exe"]
  any = true
  optional = true
  [[components.install]]
  kind = "system"
  # Wayland and X11 want different tools and a desktop may run either, so both
  # are installed where the package manager has them.
  packages.apt = ["xclip", "wl-clipboard"]
  packages.dnf = ["xclip", "wl-clipboard"]
  packages.yum = ["xclip"]
  packages.zypper = ["xclip", "wl-clipboard"]
  packages.pacman = ["xclip", "wl-clipboard"]
  packages.apk = ["xclip", "wl-clipboard"]
  [[components.install]]
  kind = "system"
  # Older archives that carry only the X11 half.
  packages.apt = ["xclip"]
  packages.dnf = ["xclip"]
  packages.zypper = ["xclip"]
  packages.pacman = ["xclip"]
  packages.apk = ["xclip"]
  [[components.install]]
  kind = "manual"
  instructions = [
      "No clipboard tool was installed. The sign-in URL is still written to a file:",
      "  cat \"$INITIALIZE_CLAUDE_AI_STATE_DIR/sign-in-url.txt\"",
  ]

[[components]]
key = "wslu"
title = "wslview (opens the Windows browser from WSL)"
group = "browser"
required = false
# Not an operating system but a place inside one: `wsl` is a trait, and no
# distribution outside WSL carries this package. See PlatformInfo.traits.
platforms = ["wsl"]
# A WSL install has a perfectly good browser; it is simply on the other side of
# the machine. wslview hands it the URL, so the sign-in URL is opened there for
# the operator. Without wslview it looks headless, and every operator on WSL
# has to carry the URL across by hand for no reason.
  [[components.verify]]
  kind = "binary"
  names = ["wslview"]
  version_args = ["--version"]
  optional = true
  [[components.install]]
  kind = "system"
  packages.apt = ["wslu"]
  packages.dnf = ["wslu"]
  packages.zypper = ["wslu"]
  packages.pacman = ["wslu"]

